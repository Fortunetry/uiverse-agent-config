<!-- Hero Section Modern Minimalist -->
<header style="background-color: #fafafa; min-height: 100vh; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111827;">
  <nav style="padding: 1.5rem 3rem; display: flex; justify-content: space-between; border-bottom: 1px solid #eaeaea; background: #fff;">
    <span style="font-weight: 700; font-size: 1.25rem;">Minimal.</span>
    <button style="background: #111827; color: #fff; border: none; padding: 0.5rem 1.25rem; border-radius: 6px; font-weight: 500; cursor: pointer;">Daftar</button>
  </nav>
  <main style="max-width: 900px; margin: 8rem auto; text-align: center; padding: 0 2rem;">
    <h1 style="font-size: 4rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 1.5rem; line-height: 1.1;">Fokus pada Esensi.</h1>
    <p style="font-size: 1.25rem; color: #4b5563; max-width: 600px; margin: 0 auto 3rem auto; line-height: 1.6;">Menghilangkan gangguan dekoratif untuk antarmuka yang bersih, responsif, dan dapat diakses oleh semua pengguna.</p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <button style="background: #2563eb; color: #fff; border: none; padding: 0.875rem 2rem; border-radius: 6px; font-size: 1rem; font-weight: 500; cursor: pointer;">Mulai Uji Coba</button>
      <button style="background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 0.875rem 2rem; border-radius: 6px; font-size: 1rem; font-weight: 500; cursor: pointer;">Dokumentasi</button>
    </div>
  </main>
</header>
