<!-- Hero Section 8-Bit Retro -->
<header style="background-color: #0000aa; min-height: 100vh; padding: 2rem; font-family: 'Press Start 2P', monospace; color: #ffffff; text-align: center; image-rendering: pixelated;">
  <div style="margin-top: 10vh;">
    <h1 style="font-size: 3rem; text-shadow: 4px 4px 0px #000; margin-bottom: 2rem;">LEVEL 1: START</h1>
    <p style="font-size: 1rem; line-height: 2; margin-bottom: 3rem;">Membawa kembali era keemasan antarmuka digital.</p>
    
    <!-- Simulasi border pixelated menggunakan box-shadow -->
    <button style="background: #e52521; color: #fff; font-family: inherit; font-size: 1.2rem; padding: 1rem 2rem; border: none; border-radius: 0px; cursor: pointer;
    box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.5), inset 4px 4px 0px 0px rgba(255,255,255,0.5), 0 0 0 4px #000;">
      START GAME
    </button>
  </div>
</header>
